<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doom</title>
<style>
html, body { margin:0; height:100%; background:#000; overflow:hidden; }
#game { width:100%; height:100%; }
#startButton { display:block; margin:20vh auto; padding:12px 24px; font-size:18px; background:#4CAF50; color:#fff; border:none; border-radius:8px; cursor:pointer; }
</style>
</head>
<body>
<div id="game" style="display:none;"></div>
<button id="startButton">PLAY Doom</button>
<script>
document.getElementById("startButton").addEventListener("click", function() {
  this.style.display = "none";
  document.getElementById("game").style.display = "block";
  window.EJS_player = "#game";
  window.EJS_core = "jaguar";
  window.EJS_color = "#000000";
  window.EJS_startOnLoaded = true;
  window.EJS_pathtodata = "https://cdn.jsdelivr.net/gh/a456pur/seraph@81f551ca0aa8e3d6018d32d8ac5904ac9bc78f76/storage/emulatorjs/data";
  window.EJS_gameUrl = "https://cdn.jsdelivr.net/gh/bubbls/clsm64@48fcd80e1ddb6d0f8103392a62df8cb98c645b6c/Doom%20(World).zip";
  var s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/gh/a456pur/seraph@81f551ca0aa8e3d6018d32d8ac5904ac9bc78f76/storage/emulatorjs/data/loader.js";
  document.body.appendChild(s);
});
</script>
</body>
</html>
